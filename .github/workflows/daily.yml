name: Daily AI Briefing Pipeline

on:
  schedule:
    - cron: '0 0 * * *'  # 台灣時間每日早上 08:00
  workflow_dispatch:      # 允許手動點擊測試

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-genai edge-tts python-dotenv markdown

      - name: Run briefing script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        run: |
          python daily_briefing.py

      - name: Deploy audio to GitHub Pages
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add briefing_*.mp3

          # 只保留最近 7 天的音檔，避免 repo 隨時間無限增長
          cutoff=$(date -d '7 days ago' +%Y%m%d)
          for f in briefing_*.mp3; do
            [ -e "$f" ] || continue
            fdate=$(echo "$f" | grep -oE '[0-9]{8}' | head -1)
            if [ -n "$fdate" ] && [ "$fdate" -lt "$cutoff" ]; then
              git rm -q "$f"
            fi
          done

          git commit -m "Add briefing audio $(date +%Y-%m-%d_%H:%M:%S)" || exit 0
          git pull --rebase
          git push
